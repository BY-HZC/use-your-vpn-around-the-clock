name: Check generated configs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install YAML validator
        run: python -m pip install PyYAML==6.0.2
      - name: Verify generated files
        run: python scripts/generate.py --check
      - name: Run tests
        run: python -m unittest discover -s tests -v
